version: "3.9"

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - USE_GPU=false
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - LOG_LEVEL=DEBUG
    volumes:
      - ./models:/models
    restart: unless-stopped